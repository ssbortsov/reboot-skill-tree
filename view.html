<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital-дизайнер REBOOT — дерево навыков</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Onest","Helvetica Neue",Arial,sans-serif;
  --bg:#EFEBE3;--bg2:#E2DCD0;--ink:#1B1C20;--dim:#6A6B73;--faint:#9B9BA2;
  --panel:rgba(255,254,250,.94);--hair:rgba(27,28,32,.14);--edge:rgba(27,28,32,.2);
  --node:#DCD6C9;--stroke:rgba(27,28,32,.26);
  --g0:#6E5CC4;--g1:#B77C22;--g2:#1F7A74;--g3:#A9492E;--g4:#5E6B2F;--g5:#96506A;--g6:#2E7A4F;--g7:#2D6FA8;--g8:#7A6A8F;--g9:#4F6D7A;--g10:#8A3B5C;--g11:#7A5C2E;--base:#8A6A1F;
  --ok:#2E7A4F;--lack:#A9492E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101219;--bg2:#0A0B10;--ink:#E9E6DE;--dim:#9A9BA6;--faint:#5E606C;
  --panel:rgba(18,20,27,.94);--hair:rgba(233,230,222,.13);--edge:rgba(233,230,222,.18);
  --node:#242731;--stroke:rgba(233,230,222,.24);
  --g0:#9B8BEE;--g1:#E3A845;--g2:#4FBDB2;--g3:#E07A55;--g4:#9FB05C;--g5:#D284A0;--g6:#5FC08C;--g7:#7BA8E2;--g8:#B9A6D8;--g9:#8FB3C2;--g10:#E07AA0;--g11:#C9A06A;--base:#E0BE62;
  --ok:#5FC08C;--lack:#E07A55;
}}
:root[data-theme="dark"]{
  --bg:#101219;--bg2:#0A0B10;--ink:#E9E6DE;--dim:#9A9BA6;--faint:#5E606C;
  --panel:rgba(18,20,27,.94);--hair:rgba(233,230,222,.13);--edge:rgba(233,230,222,.18);
  --node:#242731;--stroke:rgba(233,230,222,.24);
  --g0:#9B8BEE;--g1:#E3A845;--g2:#4FBDB2;--g3:#E07A55;--g4:#9FB05C;--g5:#D284A0;--g6:#5FC08C;--g7:#7BA8E2;--g8:#B9A6D8;--g9:#8FB3C2;--g10:#E07AA0;--g11:#C9A06A;--base:#E0BE62;
  --ok:#5FC08C;--lack:#E07A55;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex}
#stage{position:relative;flex:1 1 auto;min-width:0;
  background:radial-gradient(ellipse at 50% 48%,var(--bg) 0%,var(--bg2) 80%)}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg#map.drag{cursor:grabbing}
.edge{stroke:var(--edge);stroke-width:2.4;fill:none}
.nd{cursor:pointer}
.nd .bg{fill:var(--node);stroke-width:2.5}
.nd .fl{stroke:none;opacity:.6}
.nd:hover .bg,.nd.sel .bg{stroke:var(--ink);stroke-width:4}
.nd.off{opacity:.62}
.nd.off .val{fill:var(--dim)}
.nd.dim{opacity:.1}
.nd.hit .bg{stroke-width:5}
.nm{text-anchor:middle;pointer-events:none;fill:var(--ink);font-weight:500;font-size:16px;
  paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.hub .nm{font-family:var(--mono);text-transform:uppercase;font-size:17px;opacity:1;font-weight:700;letter-spacing:.03em}
.core .nm{font-family:var(--mono);text-transform:uppercase;font-size:19px;opacity:1;font-weight:800;letter-spacing:.03em}
.val{font-family:var(--mono);text-anchor:middle;pointer-events:none;fill:var(--ink);font-weight:700;font-size:17px;
  paint-order:stroke;stroke:var(--bg);stroke-width:4px;font-variant-numeric:tabular-nums}
.core .val{font-size:30px}
.hud{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.hud>*{pointer-events:auto}
.card{background:var(--panel);border:1px solid var(--hair);border-radius:3px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#grades,#tracks{display:flex;overflow:hidden;align-items:stretch}
#tracks .lbl{padding:9px 4px 9px 12px;color:var(--dim);font-size:12px;align-self:center}
#tracks button{border:0;border-left:1px solid var(--hair);border-radius:0;background:transparent;padding:9px 13px}
#tracks button.act{background:var(--ink);color:var(--bg)}
#tracks.muted button.act{background:var(--hair);color:var(--ink)}
.hub.spec .bg{stroke-width:6}
#grades button{border:0;border-right:1px solid var(--hair);border-radius:0;background:transparent;padding:9px 13px}
#grades button:last-child{border-right:0}
#grades button.act{background:var(--ink);color:var(--bg)}
input[type=search]{font:inherit;color:var(--ink);background:transparent;border:0;outline:0;padding:9px 12px;width:150px}
input[type=search]::placeholder{color:var(--faint)}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--hair);
  border-radius:3px;padding:8px 11px;cursor:pointer}
button:hover{border-color:var(--edge)}
button.act{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,.nd:focus-visible{outline:2px solid var(--g1);outline-offset:2px}
#panel{position:absolute;top:0;right:0;bottom:0;width:360px;z-index:5;background:var(--panel);border-left:1px solid var(--hair);display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:-8px 0 24px rgba(0,0,0,.08)}
#head{padding:16px 18px 13px;border-bottom:1px solid var(--hair)}
#head .kind,.gradecard .kind{font-family:var(--mono);text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--dim)}
#head h2{font-family:var(--mono);text-transform:uppercase;font-weight:700;font-size:17px;margin:5px 0 8px;line-height:1.3;letter-spacing:.02em}
#head p{margin:0;color:var(--dim);max-width:60ch}
#body{flex:1;overflow-y:auto;padding:14px 18px 34px}
h3{font-family:var(--mono);text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--dim);margin:0 0 8px}
ul{list-style:none;margin:0 0 18px;padding:0}
li{padding:6px 0 6px 12px;border-left:2px solid var(--hair);margin-bottom:2px;font-size:13px;cursor:pointer}
li:hover{background:var(--hair)}
li b{float:right;font-variant-numeric:tabular-nums;font-weight:600}
li span{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 0 16px}
.ladder div{text-align:center;padding:7px 2px;border:1px solid var(--hair);border-radius:3px}
.ladder div.cur{border-color:var(--ink);background:var(--hair)}
.ladder em{font-family:var(--mono);text-transform:uppercase;display:block;font-style:normal;font-size:10px;letter-spacing:.04em;color:var(--dim);margin-bottom:3px}
.ladder b{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.setter{display:flex;gap:4px;margin-bottom:16px}
.setter button{flex:1;padding:8px 0;font-variant-numeric:tabular-nums}
.gapline{padding:8px 10px;border-left:3px solid var(--lack);background:var(--hair);margin-bottom:14px;font-size:13px}
.gapline.done{border-color:var(--ok)}
.scale{font-size:12px;color:var(--dim)}
.scale div{padding:2px 0}
.nd.disabled{opacity:.8}
.nd.disabled .bg{stroke:var(--faint);stroke-width:2}
.nd.disabled .val,.nd.disabled .nm{fill:var(--faint)}
.slash{display:none;stroke:var(--faint);stroke-width:3;stroke-linecap:round}
.nd.disabled .slash{display:block}
.nd.disabled .val{font-size:15px;font-weight:500;fill:var(--dim)}
.gapline.muted{border-color:var(--faint)}
.toggle{width:100%;margin:4px 0 6px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.nd.skill{cursor:pointer}
#panel.closed{display:none}
#grip{position:absolute;left:-4px;top:0;bottom:0;width:9px;cursor:col-resize;z-index:3}
#grip:hover,#grip.on{background:linear-gradient(90deg,transparent 3px,var(--edge) 3px,var(--edge) 5px,transparent 5px)}
#head{position:relative;padding-right:84px!important}
.pctl{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.pctl button{width:32px;height:32px;padding:0;font-size:17px;line-height:1;background:transparent}
#reopen{position:absolute;top:12px;right:12px;display:none}
body.resizing{cursor:col-resize;user-select:none}
@media (max-width:900px){
  #grip{display:block;left:0;right:0;top:-6px;width:auto;height:14px;cursor:row-resize}
  #grip::after{content:"";position:absolute;left:50%;top:4px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--edge)}
  #grip:hover,#grip.on{background:none}
  #grip:hover::after,#grip.on::after{background:var(--ink)}
  body.resizing{cursor:row-resize}
  #panel.wide{height:86%!important}
  #reopen{top:auto;bottom:12px}
}
.gradecard{padding:12px 14px;border:1px solid var(--hair);border-radius:3px;margin:0 0 16px}
.gradecard h4{font-family:var(--mono);text-transform:uppercase;font-weight:700;font-size:14px;letter-spacing:.02em;margin:4px 0 6px}
.gradecard p{margin:0;color:var(--dim)}
.frame{fill:var(--ink);fill-opacity:0;stroke:none}
.frame.now{fill-opacity:.07}
.tierlab{font-family:var(--mono);text-transform:uppercase;font-weight:700;font-size:19px;letter-spacing:.05em;fill:var(--dim)}
.col{fill:var(--ink);opacity:.035}
.colspec{opacity:.06}
.colbase{fill:var(--base);opacity:.07}
.speclab{font-family:var(--mono);text-transform:uppercase;font-weight:700;font-size:18px;letter-spacing:.08em;fill:var(--dim);text-anchor:middle}
.gate{fill:none;stroke:var(--base);stroke-width:4}
.gate.shut{stroke-dasharray:10 10;opacity:.6}
.nd.cap .bg{stroke-width:5}
.nd.cap .nm{font-family:var(--mono);text-transform:uppercase;font-weight:700;font-size:13px;letter-spacing:.03em}
.nd.locked{opacity:.5}
.nd.isbase.hub .bg{stroke-width:6}
.restore{float:right;font-size:12px;padding:3px 8px;margin-left:8px}
#foot{padding:9px 18px;border-top:1px solid var(--hair);font-size:12px;color:var(--faint)}
@media (max-width:900px){
  #app{flex-direction:column}
  #stage{flex:1 1 auto}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:46%;border-left:0;border-top:1px solid var(--hair);box-shadow:0 -8px 24px rgba(0,0,0,.08)}
  .hud{padding:8px;gap:6px}
  #grades button{padding:8px 10px;font-size:12px}
  input[type=search]{width:110px}
  #head{padding:12px 15px 10px}#body{padding:12px 15px 20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">

      <g id="view"></g>
    </svg>
    <div class="hud">

  </aside>
</div>

    var nm=el("text",{x:n.x,y:n.y+n.r+(n.t==="skill"?22:30),"class":"nm"});
    if(n.t==="core"&&n.name.length>14&&n.name.lastIndexOf(" ")>0){
      var cut=n.name.lastIndexOf(" ");
      var t1=el("tspan",{x:n.x,dy:"0"});t1.textContent=n.name.slice(0,cut);
      var t2=el("tspan",{x:n.x,dy:"1.15em"});t2.textContent=n.name.slice(cut+1);
      nm.appendChild(t1);nm.appendChild(t2);
    }else if(n.t==="skill")wrapLabel(n.name,nm,n.x);
    else if(n.t==="hub"&&n.name.length>12)wrapLabel(n.name,nm,n.x);
    else nm.textContent=n.name;
    var sl=el("line",{x1:n.x-n.r*0.72,y1:n.y+n.r*0.72,x2:n.x+n.r*0.72,y2:n.y-n.r*0.72,"class":"slash"});
    g.appendChild(bg);g.appendChild(fl);g.appendChild(sl);g.appendChild(val);g.appendChild(nm);
    g.addEventListener("click",function(ev){ev.stopPropagation();if(!drag.moved){openPanel();pick(n.id);}});
    g.addEventListener("keydown",function(ev){
      if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();pick(n.id);}
    });
    gN.appendChild(g);
    gel[n.id]={g:g,rect:rect,fl:fl,bg:bg,val:val,n:n};
  });
  var bx=minX,by=Y_CORE-140,bw=maxX-minX,bh=bottom-by+40;
  if(!VB)VB=[bx,by,bw,bh];
  else{var x1=Math.min(VB[0],bx),y1=Math.min(VB[1],by),x2=Math.max(VB[0]+VB[2],bx+bw),y2=Math.max(VB[1]+VB[3],by+bh);VB=[x1,y1,x2-x1,y2-y1];}
  svg.setAttribute("viewBox",VB.join(" "));
  applySearch();
}
function baseClosed(){
  var b=GROUPS.filter(function(g){return g.base;})[0];
  return vis(b.skills).filter(function(x){return !disabled[x.key];}).every(function(x){return lvl(x)>=x.req[0];});
}

var gbox=document.getElementById("grades");
GRADES.forEach(function(gr,i){
  var b=document.createElement("button");b.textContent=gr.s;
  b.onclick=function(){G=i;save();paintGrades();paintTracks();pick(sel);};

var tbox=document.getElementById("tracks");
[["web","Веб"],["games","Игры"]].forEach(function(t){
  var b=document.createElement("button");b.textContent=t[1];b.setAttribute("data-t",t[0]);
  b.onclick=function(){track=t[0];save();paintTracks();pick(sel);};tbox.appendChild(b);});
function paintTracks(){
  Array.prototype.forEach.call(tbox.querySelectorAll("button"),function(b){b.classList.toggle("act",b.getAttribute("data-t")===track);});
  tbox.classList.toggle("muted",specBoth());
  tbox.title=specBoth()?"На этом грейде обязательны обе специализации":"Выбранный трек идёт в грейд";
}
function paintGrades(){Array.prototype.forEach.call(gbox.children,function(b,i){b.classList.toggle("act",i===G);});}

function render(){
  var lockTrees=mine&&!baseClosed();
  tierBands.forEach(function(b,i){if(b)b.classList.toggle("now",i===G);});
  gateEls.forEach(function(p){p.classList.toggle("shut",lockTrees);});
  nodes.forEach(function(n){
    var o=gel[n.id],v,col=gcol(n.gi),txt,off=false;
    if(n.t==="skill"){
      var r=req(n.sk);
      if(isOff(n.sk)){v=0;txt=String(r);col="var(--faint)";}
      else if(mine){var m=lvl(n.sk);v=m;txt=m+"/"+r;col=m>=r?"var(--ok)":"var(--lack)";}
      else{v=r;txt=String(r);}
      off=(r===0&&!mine)||trackOff(n.sk);
      if(growth&&G>0&&req(n.sk)<=req(n.sk,G-1))off=true;
      if(growth&&G===0&&req(n.sk)===0)off=true;
    }else{
      var list=active(n.t==="core"?ALL:n.g.skills),sr=0,sm=0;
      list.forEach(function(s){sr+=req(s);sm+=Math.min(lvl(s),req(s));});
      if(mine){v=5*sm/(sr||1);txt=sm+"/"+sr;col=(sr&&sm>=sr)?"var(--ok)":gcol(n.gi);}
      else{v=list.length?sr/list.length:0;txt=String(sr);}
    }
    if(n.t==="hub"&&n.g.track&&!specBoth()&&n.g.track!==track)off=true;
    var frac=Math.max(0,Math.min(1,v/5));
    o.rect.setAttribute("height",2*n.r*frac);
    o.rect.setAttribute("y",n.y+n.r-2*n.r*frac);
    o.fl.setAttribute("fill",col);o.bg.setAttribute("stroke",col);
    o.val.textContent=txt;
    o.g.classList.toggle("off",off&&!(n.t==="skill"&&isOff(n.sk)));
    o.g.classList.toggle("disabled",n.t==="skill"&&isOff(n.sk));
    o.g.classList.toggle("locked",lockTrees&&n.g&&!n.g.base);
    o.g.classList.toggle("sel",n.id===sel);
  });
}
function pick(id){

}

var K=document.getElementById("k"),T=document.getElementById("t"),Dd=document.getElementById("d"),B=document.getElementById("body");
function setEdit(){}

    try{document.execCommand("copy");flash(okMsg);}catch(e){flash("Скопировать не вышло");}document.body.removeChild(ta);}

function ladder(s){
  var h='<div class="ladder">';
  GRADES.forEach(function(gr,i){h+='<div class="'+(i===G?"cur":"")+'"><em>'+gr.s+'</em><b>'+s.req[i]+'</b></div>';});

}
function scaleBlock(){
  var h='<h3>Шкала уровней</h3><div class="scale">';
  SCALE.forEach(function(x,i){h+='<div><b>'+i+'</b> — '+x+'</div>';});

function panelSkill(s){
  setEdit();K.textContent=s.g.short;T.textContent=s.n;Dd.textContent=s.d||"";
  var r=req(s),m=lvl(s),h=ladder(s);
  h+='<h3>Мой уровень</h3><div class="setter">';
  for(var i=0;i<=5;i++)h+='<button data-set="'+i+'" data-key="'+s.key+'" class="'+(m===i?"act":"")+'">'+i+'</button>';
  var tOff=trackOff(s);
  h+='</div><div class="gapline'+(tOff?" muted":(m>=r?" done":""))+'">'+
     (tOff?"На грейде «"+GRADES[G].s+"» в грейд идёт только выбранный трек. Этот навык — трек «"+TRACKN[s.g.track]+"».":r===0?"На грейде «"+GRADES[G].s+"» не требуется.":
      m>=r?"Требование грейда «"+GRADES[G].s+"» закрыто: нужно "+r+", есть "+m+".":
      "До грейда «"+GRADES[G].s+"» не хватает "+(r-m)+" "+(r-m===1?"пункта":"пунктов")+": нужно "+r+", есть "+m+".")+'</div>';
  if(s.sub&&s.sub.length){
    h+='<h3>Из чего состоит</h3><ul>'+
      s.sub.map(function(x){return '<li style="border-color:'+gcol(s.g.gi)+';cursor:default">'+x+'</li>';}).join('')+
      '</ul>';
  }
  h+='<h3>Соседние навыки ветки</h3><ul>';
  vis(s.g.skills).forEach(function(x){if(x.key!==s.key)h+='<li data-id="'+x.key+'" style="border-color:'+gcol(s.g.gi)+'">'+x.n+'<b>'+req(x)+'</b></li>';});
  h+='</ul>';
  B.innerHTML=h+scaleBlock();bind();
}
function panelGroup(gi){
  var g=GROUPS[gi],list=vis(g.skills),sr=0,sm=0;
  active(g.skills).forEach(function(s){sr+=req(s);sm+=Math.min(lvl(s),req(s));});
  setEdit();K.textContent="Группа навыков · "+GRADES[G].s;T.textContent=g.short;Dd.textContent=g.desc||"";
  var h='';
  if(g.base){
    h+='<div class="gapline'+(mine?(baseClosed()?" done":""):" muted")+'">Фундамент: пока каждый навык базы не доведён до уровня джуна, ветки закрыты.'+
       (mine?(baseClosed()?' База закрыта.':' База не закрыта.'):'')+'</div>';
  }
  if(g.track){
    var both=GRADES.filter(function(x){return x.spec!=="track";}).map(function(x){return x.s;}).join(", ");
    var tr=GRADES.filter(function(x){return x.spec==="track";}).map(function(x){return x.s;}).join(", ");
    h+='<div class="gapline muted">Специализация «'+TRACKN[g.track]+'». Обязательна на грейдах: '+both+'. На грейдах '+tr+' — только если выбран этот трек.'+
       (trackOff(g.skills[0])?' Сейчас выбран другой трек, ветка в грейд не идёт.':'')+'</div>';
  }
  h+='<h3>Сумма требований грейда: '+sr+(mine?" · закрыто "+sm:"")+'</h3><ul>';
  if(!list.length)h+='<li style="cursor:default">В ветке не осталось навыков.</li>';
  list.slice().sort(function(a,b){return req(b)-req(a);}).forEach(function(s){
    var r=req(s),m=lvl(s);
    if(isOff(s)){h+='<li data-id="'+s.key+'" style="color:var(--faint)">'+s.n+'<b style="font-weight:400">выкл</b></li>';return;}
    h+='<li data-id="'+s.key+'" style="border-color:'+(r===0?"var(--hair)":gcol(gi))+'">'+s.n+
       '<b style="color:'+(mine?(m>=r?"var(--ok)":"var(--lack)"):"inherit")+'">'+(mine?m+"/"+r:r)+'</b></li>';});
  h+='</ul>';
  B.innerHTML=h;bind();
}
function panelCore(){
  var gr=GRADES[G],list=active(ALL),sr=0,sm=0,grown=[];
  list.forEach(function(s){sr+=req(s);sm+=Math.min(lvl(s),req(s));
    if(G>0&&req(s)>req(s,G-1))grown.push(s);});
  setEdit();K.textContent="Ядро";T.textContent=CORE.name;Dd.textContent=CORE.desc;
  var specLine=specBoth()?"Специализации: обязательны обе — классический веб и игры.":"Специализация: в грейд идёт выбранный трек — «"+TRACKN[track]+"».";
  var h='<div class="gradecard"><div class="kind">Грейд '+(G+1)+' из '+GRADES.length+'</div>'+
        '<h4>'+gr.n+'</h4><p>'+gr.d+'</p></div>';
  h+='<h3>Сумма требований: '+sr+' пунктов на '+list.length+' навыков</h3><div class="gapline muted">'+specLine+'</div>';
  if(mine&&!baseClosed())h+='<div class="gapline">База не закрыта — ветки заблокированы. Начни с базовых навыков.</div>';
  if(mine){
    var lack=list.filter(function(s){return lvl(s)<req(s);});
    h+='<div class="gapline'+(lack.length?"":" done")+'">'+
       (lack.length?"Закрыто "+sm+" из "+sr+" пунктов. Не дотягивают "+lack.length+" навыков.":"Грейд закрыт полностью.")+'</div>';
    if(lack.length){
      h+='<h3>Где разрыв больше всего</h3><ul>';
      lack.sort(function(a,b){return (req(b)-lvl(b))-(req(a)-lvl(a));}).slice(0,8).forEach(function(s){
        h+='<li data-id="'+s.key+'" style="border-color:var(--lack)">'+s.n+'<b>'+lvl(s)+'/'+req(s)+'</b><span>'+s.g.short+'</span></li>';});
      h+='</ul>';
    }
  }
  if(G>0){
    h+='<h3>Что добавляет этот грейд к «'+GRADES[G-1].s+'»</h3><ul>';
    grown.sort(function(a,b){return (req(b)-req(b,G-1))-(req(a)-req(a,G-1));}).forEach(function(s){
      h+='<li data-id="'+s.key+'" style="border-color:'+gcol(s.g.gi)+'">'+s.n+'<b>'+req(s,G-1)+' → '+req(s)+'</b><span>'+s.g.short+'</span></li>';});
    h+='</ul>';
  }
  h+='<h3>Группы на этом грейде</h3><ul>';
  GROUPS.forEach(function(g,gi){var t=0;active(g.skills).forEach(function(s){t+=req(s);});
    h+='<li data-id="h'+gi+'" style="border-color:'+gcol(gi)+'">'+g.short+'<b>'+t+'</b></li>';});
  h+='</ul>';
  B.innerHTML=h+scaleBlock();bind();
}
document.getElementById("mine").onclick=function(){mine=!mine;this.classList.toggle("act",mine);save();pick(sel);};
document.getElementById("growth").onclick=function(){growth=!growth;this.classList.toggle("act",growth);render();};

var panel=document.getElementById("panel"),pOpen=true,pWide=false;
var bWide=document.getElementById("p-wide"),bClose=document.getElementById("p-close"),bReopen=document.getElementById("reopen");
function mobile(){return window.innerWidth<=900;}
function layoutPanel(){
  panel.classList.toggle("closed",!pOpen);
  panel.classList.toggle("wide",pWide);
  bReopen.style.display=pOpen?"none":"block";
  if(mobile()){panel.style.width="";panel.style.height=(PH&&!pWide)?Math.max(120,Math.min(window.innerHeight-80,PH))+"px":"";}
  else{panel.style.height="";var maxW=window.innerWidth-80;
    var w=pWide?Math.min(760,Math.round(window.innerWidth*0.6)):PW;
    panel.style.width=Math.max(300,Math.min(maxW,w))+"px";}

}

bClose.onclick=function(){pOpen=false;layoutPanel();};
bReopen.onclick=function(){pOpen=true;layoutPanel();};
bWide.onclick=function(){pWide=!pWide;layoutPanel();};

(function(){
  var grip=document.getElementById("grip"),on=false;
  grip.addEventListener("pointerdown",function(ev){on=true;grip.classList.add("on");document.body.classList.add("resizing");
    grip.setPointerCapture(ev.pointerId);ev.preventDefault();});
  grip.addEventListener("pointermove",function(ev){if(!on)return;
    if(mobile())PH=Math.max(120,Math.min(window.innerHeight-80,window.innerHeight-ev.clientY));
    else PW=Math.max(300,Math.min(window.innerWidth-80,window.innerWidth-ev.clientX));

  grip.addEventListener("pointerup",stop);grip.addEventListener("pointercancel",stop);

var k=1,tx=0,ty=0;
function apply(){view.setAttribute("transform","translate("+tx+" "+ty+") scale("+k+")");
  var r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,sc=vb.width?Math.min(r.width/vb.width,r.height/vb.height):1;
  view.classList.toggle("z",16*sc*k>=8.5);}
function initialView(){
  var r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;if(!vb.width||!r.width){k=1;tx=0;ty=0;apply();return;}
  var sc=Math.min(r.width/vb.width,r.height/vb.height);
  k=Math.max(1,Math.min(3,11/(16*sc)));
  var offX=r.left+(r.width-vb.width*sc)/2,offY=r.top+(r.height-vb.height*sc)/2;
  var pw=(!mobile()&&pOpen)?panel.getBoundingClientRect().width:0;
  var sx=r.left+(r.width-pw)/2,sy=r.top+(mobile()?60:74);
  tx=(sx-offX)/sc+vb.x;ty=(sy-offY)/sc+vb.y-k*(vb.y+40);apply();
}
function toVB(ev){var r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
  var sc=Math.min(r.width/vb.width,r.height/vb.height);
  var ox=r.left+(r.width-vb.width*sc)/2,oy=r.top+(r.height-vb.height*sc)/2;
  return [(ev.clientX-ox)/sc+vb.x,(ev.clientY-oy)/sc+vb.y];}
svg.addEventListener("wheel",function(ev){ev.preventDefault();
  var p=toVB(ev),f=ev.deltaY<0?1.12:1/1.12,nk=Math.max(.6,Math.min(4,k*f));
  tx=p[0]-(p[0]-tx)*(nk/k);ty=p[1]-(p[1]-ty)*(nk/k);k=nk;apply();},{passive:false});
var drag={on:false,x:0,y:0,moved:false},pts={};
svg.addEventListener("pointerdown",function(ev){pts[ev.pointerId]=toVB(ev);
  if(Object.keys(pts).length===1){drag.on=true;drag.x=pts[ev.pointerId][0];drag.y=pts[ev.pointerId][1];drag.moved=false;svg.classList.add("drag");}});
svg.addEventListener("pointermove",function(ev){
  if(!(ev.pointerId in pts))return;
  var ids=Object.keys(pts);
  if(ids.length>=2){var o=[pts[ids[0]],pts[ids[1]]];pts[ev.pointerId]=toVB(ev);
    var n2=[pts[ids[0]],pts[ids[1]]];
    var d0=Math.hypot(o[0][0]-o[1][0],o[0][1]-o[1][1]),d1=Math.hypot(n2[0][0]-n2[1][0],n2[0][1]-n2[1][1]);
    if(d0>1&&d1>1){var nk=Math.max(.6,Math.min(4,k*(d1/d0)));
      var cx=(n2[0][0]+n2[1][0])/2,cy=(n2[0][1]+n2[1][1])/2;
      tx=cx-(cx-tx)*(nk/k);ty=cy-(cy-ty)*(nk/k);k=nk;apply();}
    drag.moved=true;return;}
  if(!drag.on)return;
  var p=toVB(ev),dx=p[0]-drag.x,dy=p[1]-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;
  tx+=dx;ty+=dy;apply();
  pts[ev.pointerId]=toVB(ev);drag.x=pts[ev.pointerId][0];drag.y=pts[ev.pointerId][1];});
function up(ev){delete pts[ev.pointerId];if(!Object.keys(pts).length){drag.on=false;svg.classList.remove("drag");
  setTimeout(function(){drag.moved=false;},0);}}
svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
document.getElementById("fit").onclick=function(){k=1;tx=0;ty=0;apply();};
document.getElementById("fit").ondblclick=initialView;
window.addEventListener("resize",apply);
document.getElementById("mine").classList.toggle("act",mine);
layoutPanel();build();paintGrades();paintTracks();initialView();pick("core");
})();
