<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital-дизайнер REBOOT — карта навыков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Onest","Helvetica Neue",Arial,sans-serif;
  --bg:#EFEBE3;--bg2:#E2DCD0;--ink:#1B1C20;--dim:#6A6B73;--faint:#9B9BA2;
  --panel:rgba(255,254,250,.94);--hair:rgba(27,28,32,.14);--edge:rgba(27,28,32,.2);
  --node:#DCD6C9;--stroke:rgba(27,28,32,.26);
  --g0:#6E5CC4;--g1:#B77C22;--g2:#1F7A74;--g3:#A9492E;--g4:#5E6B2F;--g5:#96506A;--g6:#2E7A4F;--g7:#2D6FA8;--g8:#7A6A8F;
  --ok:#2E7A4F;--lack:#A9492E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101219;--bg2:#0A0B10;--ink:#E9E6DE;--dim:#9A9BA6;--faint:#5E606C;
  --panel:rgba(18,20,27,.94);--hair:rgba(233,230,222,.13);--edge:rgba(233,230,222,.18);
  --node:#242731;--stroke:rgba(233,230,222,.24);
  --g0:#9B8BEE;--g1:#E3A845;--g2:#4FBDB2;--g3:#E07A55;--g4:#9FB05C;--g5:#D284A0;--g6:#5FC08C;--g7:#7BA8E2;--g8:#B9A6D8;
  --ok:#5FC08C;--lack:#E07A55;
}}
:root[data-theme="dark"]{
  --bg:#101219;--bg2:#0A0B10;--ink:#E9E6DE;--dim:#9A9BA6;--faint:#5E606C;
  --panel:rgba(18,20,27,.94);--hair:rgba(233,230,222,.13);--edge:rgba(233,230,222,.18);
  --node:#242731;--stroke:rgba(233,230,222,.24);
  --g0:#9B8BEE;--g1:#E3A845;--g2:#4FBDB2;--g3:#E07A55;--g4:#9FB05C;--g5:#D284A0;--g6:#5FC08C;--g7:#7BA8E2;--g8:#B9A6D8;
  --ok:#5FC08C;--lack:#E07A55;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex}
#stage{position:relative;flex:1 1 auto;min-width:0;
  background:radial-gradient(ellipse at 50% 48%,var(--bg) 0%,var(--bg2) 80%)}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg#map.drag{cursor:grabbing}
.edge{stroke:var(--edge);stroke-width:2.4;fill:none}
.nd{cursor:pointer}
.nd .bg{fill:var(--node);stroke-width:2.5}
.nd .fl{stroke:none;opacity:.6}
.nd:hover .bg,.nd.sel .bg{stroke:var(--ink);stroke-width:4}
.nd.off{opacity:.24}
.nd.dim{opacity:.1}
.nd.hit .bg{stroke-width:5}
.nm{text-anchor:middle;pointer-events:none;fill:var(--ink);font-weight:500;font-size:16px;
  paint-order:stroke;stroke:var(--bg);stroke-width:4px;opacity:0;transition:opacity .15s}
#view.z .nm{opacity:1}
.hub .nm{font-family:var(--mono);text-transform:uppercase;font-size:17px;opacity:1;font-weight:700;letter-spacing:.03em}
.core .nm{font-family:var(--mono);text-transform:uppercase;font-size:19px;opacity:1;font-weight:800;letter-spacing:.03em}
.val{font-family:var(--mono);text-anchor:middle;pointer-events:none;fill:var(--ink);font-weight:700;font-size:17px;
  paint-order:stroke;stroke:var(--bg);stroke-width:4px;font-variant-numeric:tabular-nums}
.core .val{font-size:30px}
.hud{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.hud>*{pointer-events:auto}
.card{background:var(--panel);border:1px solid var(--hair);border-radius:3px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#grades,#tracks{display:flex;overflow:hidden;align-items:stretch}
#tracks .lbl{padding:9px 4px 9px 12px;color:var(--dim);font-size:12px;align-self:center}
#tracks button{border:0;border-left:1px solid var(--hair);border-radius:0;background:transparent;padding:9px 13px}
#tracks button.act{background:var(--ink);color:var(--bg)}
#tracks.muted button.act{background:var(--hair);color:var(--ink)}
.hub.spec .bg{stroke-width:6}
#grades button{border:0;border-right:1px solid var(--hair);border-radius:0;background:transparent;padding:9px 13px}
#grades button:last-child{border-right:0}
#grades button.act{background:var(--ink);color:var(--bg)}
input[type=search]{font:inherit;color:var(--ink);background:transparent;border:0;outline:0;padding:9px 12px;width:150px}
input[type=search]::placeholder{color:var(--faint)}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--hair);
  border-radius:3px;padding:8px 11px;cursor:pointer}
button:hover{border-color:var(--edge)}
button.act{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,.nd:focus-visible{outline:2px solid var(--g1);outline-offset:2px}
#panel{position:absolute;top:0;right:0;bottom:0;width:360px;z-index:5;background:var(--panel);border-left:1px solid var(--hair);display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:-8px 0 24px rgba(0,0,0,.08)}
#head{padding:16px 18px 13px;border-bottom:1px solid var(--hair)}
#head .kind,.gradecard .kind{font-family:var(--mono);text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--dim)}
#head h2{font-family:var(--mono);text-transform:uppercase;font-weight:700;font-size:17px;margin:5px 0 8px;line-height:1.3;letter-spacing:.02em}
#head p{margin:0;color:var(--dim);max-width:60ch}
#body{flex:1;overflow-y:auto;padding:14px 18px 34px}
h3{font-family:var(--mono);text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--dim);margin:0 0 8px}
ul{list-style:none;margin:0 0 18px;padding:0}
li{padding:6px 0 6px 12px;border-left:2px solid var(--hair);margin-bottom:2px;font-size:13px;cursor:pointer}
li:hover{background:var(--hair)}
li b{float:right;font-variant-numeric:tabular-nums;font-weight:600}
li span{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 0 16px}
.ladder div{text-align:center;padding:7px 2px;border:1px solid var(--hair);border-radius:3px}
.ladder div.cur{border-color:var(--ink);background:var(--hair)}
.ladder em{font-family:var(--mono);text-transform:uppercase;display:block;font-style:normal;font-size:10px;letter-spacing:.04em;color:var(--dim);margin-bottom:3px}
.ladder b{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.setter{display:flex;gap:4px;margin-bottom:16px}
.setter button{flex:1;padding:8px 0;font-variant-numeric:tabular-nums}
.gapline{padding:8px 10px;border-left:3px solid var(--lack);background:var(--hair);margin-bottom:14px;font-size:13px}
.gapline.done{border-color:var(--ok)}
.scale{font-size:12px;color:var(--dim)}
.scale div{padding:2px 0}
.nd.disabled{opacity:.5}
.nd.disabled .bg{stroke-dasharray:4 6}
.nd.disabled .val{font-size:15px;font-weight:500;fill:var(--dim)}
.gapline.muted{border-color:var(--faint)}
.toggle{width:100%;margin:4px 0 6px}
[contenteditable="true"]{outline:none;border-radius:2px;cursor:text}
[contenteditable="true"]:hover{box-shadow:0 0 0 1px var(--faint)}
[contenteditable="true"]:focus{box-shadow:0 0 0 1px var(--ink);background:var(--hair)}
#d:empty:before{content:"Добавить описание";color:var(--faint)}
.addsub{margin:-10px 0 18px;font-size:12px;padding:5px 9px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.nd.skill{cursor:grab}
.nd.dragging{pointer-events:none;opacity:.9}
.nd.dragging .nm{opacity:1}
.nd.drop .bg{stroke:var(--ink)!important;stroke-width:7;stroke-dasharray:none}
select.mv{width:100%;font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--hair);border-radius:3px;padding:7px 8px;margin:0 0 12px;max-width:none}
#panel.closed{display:none}
#grip{position:absolute;left:-4px;top:0;bottom:0;width:9px;cursor:col-resize;z-index:3}
#grip:hover,#grip.on{background:linear-gradient(90deg,transparent 3px,var(--edge) 3px,var(--edge) 5px,transparent 5px)}
#head{position:relative;padding-right:84px!important}
.pctl{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.pctl button{width:32px;height:32px;padding:0;font-size:17px;line-height:1;background:transparent}
#reopen{position:absolute;top:12px;right:12px;display:none}
body.resizing{cursor:col-resize;user-select:none}
@media (max-width:900px){
  #grip{display:block;left:0;right:0;top:-6px;width:auto;height:14px;cursor:row-resize}
  #grip::after{content:"";position:absolute;left:50%;top:4px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--edge)}
  #grip:hover,#grip.on{background:none}
  #grip:hover::after,#grip.on::after{background:var(--ink)}
  body.resizing{cursor:row-resize}
  #panel.wide{height:86%!important}
  #reopen{top:auto;bottom:12px}
}
.gradecard{padding:12px 14px;border:1px solid var(--hair);border-radius:3px;margin:0 0 16px}
.gradecard h4{font-family:var(--mono);text-transform:uppercase;font-weight:700;font-size:14px;letter-spacing:.02em;margin:4px 0 6px}
.gradecard p{margin:0;color:var(--dim)}
.danger{width:100%;margin:4px 0 18px;color:var(--lack);border-color:var(--lack);background:transparent}
.danger:hover{background:var(--lack);color:var(--bg)}
.restore{float:right;font-size:12px;padding:3px 8px;margin-left:8px}
#foot{padding:9px 18px;border-top:1px solid var(--hair);font-size:12px;color:var(--faint)}
@media (max-width:900px){
  #app{flex-direction:column}
  #stage{flex:1 1 auto}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:46%;border-left:0;border-top:1px solid var(--hair);box-shadow:0 -8px 24px rgba(0,0,0,.08)}
  .hud{padding:8px;gap:6px}
  #grades button{padding:8px 10px;font-size:12px}
  input[type=search]{width:110px}
  #head{padding:12px 15px 10px}#body{padding:12px 15px 20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div>

var nd=null,justDragged=false;

  nd={n:n,g:g,start:toWorld(ev),sx:ev.clientX,sy:ev.clientY,moved:false,target:null};
  window.addEventListener("pointermove",moveNodeDrag);

function moveNodeDrag(ev){
  if(!nd)return;
  if(!nd.moved){if(Math.abs(ev.clientX-nd.sx)+Math.abs(ev.clientY-nd.sy)<6)return;
    nd.moved=true;nd.g.classList.add("dragging");nd.g.parentNode.appendChild(nd.g);svg.classList.add("drag");}
  var w=toWorld(ev);
  nd.g.setAttribute("transform","translate("+(w[0]-nd.n.x)+" "+(w[1]-nd.n.y)+")");
  var best=null,bd=1e9;
  nodes.forEach(function(m){
    if(m===nd.n||m.t==="core")return;
    var d=Math.hypot(m.x-w[0],m.y-w[1]);
    if(d<m.r+46&&d<bd){bd=d;best=m;}
  });
  if(nd.target!==best){
    if(nd.target&&gel[nd.target.id])gel[nd.target.id].g.classList.remove("drop");
    nd.target=best;if(best)gel[best.id].g.classList.add("drop");
    flash(best?(best.t==="hub"?"В конец ветки «"+best.g.short+"»":"На место «"+best.name+"» в ветке «"+best.g.short+"»"):"Отпусти на ветке или навыке");
  }

  window.removeEventListener("pointermove",moveNodeDrag);
  window.removeEventListener("pointerup",endNodeDrag);
  window.removeEventListener("pointercancel",endNodeDrag);

  if(!d.moved)return;

var k=1,tx=0,ty=0;

function toVB(ev){var r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
  var sc=Math.min(r.width/vb.width,r.height/vb.height);
  var ox=r.left+(r.width-vb.width*sc)/2,oy=r.top+(r.height-vb.height*sc)/2;
  return [(ev.clientX-ox)/sc+vb.x,(ev.clientY-oy)/sc+vb.y];}

  var p=toVB(ev),f=ev.deltaY<0?1.12:1/1.12,nk=Math.max(.6,Math.min(4,k*f));
  tx=p[0]-(p[0]-tx)*(nk/k);ty=p[1]-(p[1]-ty)*(nk/k);k=nk;apply();},{passive:false});

svg.addEventListener("pointerdown",function(ev){pts[ev.pointerId]=toVB(ev);
  if(Object.keys(pts).length===1){drag.on=true;drag.x=pts[ev.pointerId][0];drag.y=pts[ev.pointerId][1];drag.moved=false;svg.classList.add("drag");}});

  if(!(ev.pointerId in pts))return;
  var ids=Object.keys(pts);
  if(ids.length>=2){var o=[pts[ids[0]],pts[ids[1]]];pts[ev.pointerId]=toVB(ev);
    var n2=[pts[ids[0]],pts[ids[1]]];
    var d0=Math.hypot(o[0][0]-o[1][0],o[0][1]-o[1][1]),d1=Math.hypot(n2[0][0]-n2[1][0],n2[0][1]-n2[1][1]);
    if(d0>1&&d1>1){var nk=Math.max(.6,Math.min(4,k*(d1/d0)));
      var cx=(n2[0][0]+n2[1][0])/2,cy=(n2[0][1]+n2[1][1])/2;

  tx+=dx;ty+=dy;apply();
  pts[ev.pointerId]=toVB(ev);drag.x=pts[ev.pointerId][0];drag.y=pts[ev.pointerId][1];});
function up(ev){delete pts[ev.pointerId];if(!Object.keys(pts).length){drag.on=false;svg.classList.remove("drag");
  setTimeout(function(){drag.moved=false;},0);}}
svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
document.getElementById("fit").onclick=function(){k=1;tx=0;ty=0;apply();};
document.getElementById("mine").classList.toggle("act",mine);
layoutPanel();build();paintGrades();paintTracks();apply();pick("core");
})();
</script>
